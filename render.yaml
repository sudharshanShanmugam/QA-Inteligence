services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: qa-intelligence-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    envVars:
      # LLM — set your key in the Render dashboard (marked sync: false)
      - key: DEEPINFRA_API_KEY
        sync: false
      - key: DEEPINFRA_BASE_URL
        value: https://api.deepinfra.com/v1/openai
      - key: LLM_MODEL
        value: openai/gpt-oss-120b-Turbo
      - key: EMBED_MODEL
        value: BAAI/bge-large-en-v1.5
      - key: ENTITY_MODEL
        value: meta-llama/Meta-Llama-3.1-8B-Instruct
      # Graph
      - key: USE_NEO4J
        value: "false"
      - key: GRAPH_PERSIST_PATH
        value: /var/data/qa_graph.pkl
      # Vector store
      - key: CHROMA_PERSIST_DIR
        value: /var/data/chroma_db
      - key: CHROMA_COLLECTION_NAME
        value: qa_knowledge
      # Data directory for projects + analysis history
      - key: DATA_DIR
        value: /var/data
      # CORS — set to your frontend URL after first deploy, e.g.:
      #   https://qa-intelligence-frontend.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false
      # Processing
      - key: DEBUG
        value: "false"
      - key: CHUNK_SIZE
        value: "500"
      - key: CHUNK_OVERLAP
        value: "50"
      - key: MAX_RETRIEVAL_DOCS
        value: "10"
    disk:
      name: qa-data
      mountPath: /var/data
      sizeGB: 1

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  - type: web
    name: qa-intelligence-frontend
    runtime: node
    buildCommand: cd frontend/web && npm ci && npm run build
    startCommand: cd frontend/web && npm start
    envVars:
      # Set this to your backend URL after the API service is deployed, e.g.:
      #   https://qa-intelligence-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false
